name: Auth Infrastructure

on:
  pull_request:
    paths:
      - .github/workflows/auth-infra.yml
      - infra/aws/auth/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
      - run: tofu fmt -check -recursive infra/aws/auth
      - run: tofu -chdir=infra/aws/auth init -backend=false -input=false
      - run: tofu -chdir=infra/aws/auth validate
      - run: tofu -chdir=infra/aws/auth test
