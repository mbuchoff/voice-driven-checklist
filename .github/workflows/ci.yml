name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify production Cognito configuration
        env:
          EXPO_PUBLIC_COGNITO_REGION: ${{ vars.COGNITO_REGION }}
          EXPO_PUBLIC_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          EXPO_PUBLIC_COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          EXPO_PUBLIC_COGNITO_ANDROID_CLIENT_ID: ${{ vars.COGNITO_ANDROID_CLIENT_ID }}
        run: scripts/verify-production-cognito-config.sh
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm ci --prefix e2e
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e:unit

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - run: yes | sdkmanager "ndk;27.1.12297006" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
        working-directory: android
